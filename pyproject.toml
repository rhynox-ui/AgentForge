[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Model-agnostic autonomous software engineering agent powered by LangGraph."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2.11,<2",
  "langchain-core>=1.4.7,<2",
  "pydantic>=2.7.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
